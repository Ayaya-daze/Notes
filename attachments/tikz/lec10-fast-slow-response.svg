<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c2410c"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowGray); }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .blue { fill: none; stroke: #2b6cb0; stroke-width: 4; marker-end: url(#arrowBlue); }
      .red { fill: none; stroke: #c2410c; stroke-width: 4; marker-end: url(#arrowRed); }
      .orange { fill: none; stroke: #d97706; stroke-width: 4; stroke-dasharray: 10 8; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="520" fill="#f8fafc"/>
  <text x="560" y="46" text-anchor="middle" class="title">fast / slow limit in linear response</text>
  <text x="560" y="76" text-anchor="middle" class="subtitle">hydrodynamic current follows E; ballistic current follows A</text>

  <rect x="58" y="112" width="480" height="310" class="box"/>
  <rect x="582" y="112" width="480" height="310" class="box"/>

  <text x="96" y="150" class="label">slow: omega &lt;&lt; 1/tau</text>
  <text x="96" y="177" class="small">collisions relax momentum; sigma proportional to tau</text>
  <text x="620" y="150" class="label">fast: omega &gt;&gt; 1/tau</text>
  <text x="620" y="177" class="small">collisionless response; sigma proportional to 1/omega</text>

  <line x1="105" y1="294" x2="500" y2="294" class="axis"/>
  <line x1="105" y1="365" x2="105" y2="220" class="axis"/>
  <line x1="630" y1="294" x2="1025" y2="294" class="axis"/>
  <line x1="630" y1="365" x2="630" y2="220" class="axis"/>

  <line x1="178" y1="220" x2="178" y2="365" class="grid"/>
  <line x1="255" y1="220" x2="255" y2="365" class="grid"/>
  <line x1="332" y1="220" x2="332" y2="365" class="grid"/>
  <line x1="409" y1="220" x2="409" y2="365" class="grid"/>
  <line x1="703" y1="220" x2="703" y2="365" class="grid"/>
  <line x1="780" y1="220" x2="780" y2="365" class="grid"/>
  <line x1="857" y1="220" x2="857" y2="365" class="grid"/>
  <line x1="934" y1="220" x2="934" y2="365" class="grid"/>

  <path class="red" d="M118 294 C150 230, 190 230, 222 294 S294 358, 326 294 S398 230, 430 294 S470 358, 500 294"/>
  <path class="blue" d="M118 294 C150 248, 190 248, 222 294 S294 340, 326 294 S398 248, 430 294 S470 340, 500 294"/>
  <text x="438" y="235" class="small" fill="#c2410c">E(t)</text>
  <text x="438" y="257" class="small" fill="#2b6cb0">J(t)</text>
  <text x="300" y="395" text-anchor="middle" class="small">same phase</text>

  <path class="orange" d="M642 294 C674 230, 714 230, 746 294 S818 358, 850 294 S922 230, 954 294 S994 358, 1024 294"/>
  <path class="blue" d="M642 294 C674 230, 714 230, 746 294 S818 358, 850 294 S922 230, 954 294 S994 358, 1024 294"/>
  <path class="red" d="M642 230 C674 294, 714 358, 746 294 S818 230, 850 294 S922 358, 954 294 S994 230, 1024 294"/>
  <text x="960" y="232" class="small" fill="#d97706">A(t)</text>
  <text x="960" y="256" class="small" fill="#2b6cb0">J(t)</text>
  <text x="960" y="344" class="small" fill="#c2410c">E(t)</text>
  <text x="825" y="395" text-anchor="middle" class="small">J follows A; E is phase shifted</text>

  <path d="M472 450 L648 450" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="560" y="477" text-anchor="middle" class="small">increasing omega tau</text>
</svg>
